<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Repair Café Dispatch</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #6b7280;
      --line: #e6e9f0;
      --primary: #635bff;
      --primary-dark: #4f46e5;
      --green: #139b6a;
      --orange: #d97706;
      --red: #dc3d4b;
      --shadow: 0 20px 55px rgba(31, 41, 55, 0.09);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 0%, rgba(99, 91, 255, 0.11), transparent 30%),
        var(--bg);
      min-height: 100vh;
    }

    .shell { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 34px 0 50px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 28px; }
    .brand { display: flex; gap: 12px; align-items: center; }
    .logo { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 13px; background: var(--primary); color: white; font-weight: 800; box-shadow: 0 10px 20px rgba(99, 91, 255, .25); }
    h1, h2, p { margin: 0; }
    h1 { font-size: clamp(24px, 4vw, 36px); letter-spacing: -1px; }
    .subtitle { color: var(--muted); margin-top: 5px; font-size: 14px; }
    .live { display: flex; align-items: center; gap: 8px; color: var(--green); font-weight: 700; font-size: 13px; }
    .live-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 5px rgba(19, 155, 106, .12); }

    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 24px; }
    .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 17px; padding: 18px; box-shadow: var(--shadow); }
    .stat-label { color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .7px; }
    .stat-value { font-size: 30px; font-weight: 800; margin-top: 7px; letter-spacing: -1px; }
    .stat-note { font-size: 12px; color: var(--muted); margin-top: 3px; }

    .layout { display: grid; grid-template-columns: 350px 1fr; gap: 20px; align-items: start; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); overflow: hidden; }
    .panel-head { padding: 20px 20px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
    .panel-head h2 { font-size: 17px; }
    .panel-body { padding: 20px; }

    form { display: grid; gap: 14px; }
    label { display: grid; gap: 7px; color: #344054; font-size: 13px; font-weight: 700; }
    input, select, textarea { width: 100%; border: 1px solid #d9deea; border-radius: 11px; padding: 11px 12px; color: var(--text); background: #fbfcfe; font: inherit; outline: none; transition: .2s border, .2s box-shadow; }
    textarea { min-height: 86px; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(99, 91, 255, .11); }
    .button-row { display: flex; gap: 10px; margin-top: 4px; }
    button { border: 0; border-radius: 11px; padding: 11px 15px; font: inherit; font-weight: 800; cursor: pointer; transition: transform .15s, background .15s, opacity .15s; }
    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    .primary { background: var(--primary); color: white; flex: 1; }
    .primary:hover { background: var(--primary-dark); }
    .secondary { background: #eef0f7; color: #475467; }
    .secondary:hover { background: #e4e7f0; }
    .danger { background: #fff0f1; color: var(--red); }

    .queue-toolbar { display: flex; gap: 10px; align-items: center; }
    .queue-toolbar input { min-width: 190px; padding: 9px 11px; }
    .queue-list { padding: 10px 20px 20px; display: grid; gap: 10px; max-height: 585px; overflow: auto; }
    .ticket { border: 1px solid var(--line); border-radius: 15px; padding: 15px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: start; background: #fff; animation: rise .25s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    .position { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px; background: #f0efff; color: var(--primary); font-weight: 800; font-size: 13px; }
    .ticket-title { font-weight: 800; font-size: 14px; line-height: 1.35; }
    .ticket-meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 7px; color: var(--muted); font-size: 12px; }
    .pill { border-radius: 999px; padding: 4px 8px; font-weight: 800; font-size: 11px; }
    .high { color: #a3303c; background: #fff0f1; }
    .medium { color: #9a5b08; background: #fff7e8; }
    .low { color: #16704f; background: #eaf9f1; }
    .ticket-description { color: #667085; font-size: 12px; margin-top: 8px; line-height: 1.5; }
    .ticket-actions { display: flex; gap: 6px; }
    .icon-btn { padding: 7px 9px; border-radius: 8px; background: #f5f6fa; color: #667085; font-size: 12px; }
    .icon-btn:hover { background: #eceef5; }
    .empty { text-align: center; color: var(--muted); padding: 48px 20px; }
    .empty strong { display: block; color: var(--text); margin-bottom: 5px; }

    .queue-footer { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 12px; align-items: center; background: #fafbfe; }
    .queue-footer small { color: var(--muted); }
    .process { background: var(--green); color: white; }
    .process:hover { background: #0f835a; }
    .process:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    .toast { position: fixed; right: 22px; bottom: 22px; background: #172033; color: white; padding: 13px 16px; border-radius: 12px; box-shadow: var(--shadow); opacity: 0; transform: translateY(10px); pointer-events: none; transition: .25s; font-size: 13px; }
    .toast.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 820px) {
      .shell { width: min(100% - 24px, 640px); padding-top: 22px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .layout { grid-template-columns: 1fr; }
      .queue-toolbar { width: 100%; }
      .queue-toolbar input { flex: 1; min-width: 0; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="logo">Q</div>
        <div>
          <h1>Repair Café Dispatch</h1>
          <p class="subtitle">A fair FIFO queue for community repairs</p>
        </div>
      </div>
      <div class="live"><span class="live-dot"></span> Queue is live</div>
    </header>

    <section class="stats" aria-label="Queue statistics">
      <article class="stat"><div class="stat-label">In queue</div><div class="stat-value" id="waitingCount">0</div><div class="stat-note">items waiting for repair</div></article>
      <article class="stat"><div class="stat-label">Urgent</div><div class="stat-value" id="highCount">0</div><div class="stat-note">items with a deadline</div></article>
      <article class="stat"><div class="stat-label">Avg. wait</div><div class="stat-value" id="avgWait">0m</div><div class="stat-note">before a volunteer starts</div></article>
      <article class="stat"><div class="stat-label">Repaired</div><div class="stat-value" id="resolvedCount">0</div><div class="stat-note">saved from landfill</div></article>
    </section>

    <section class="layout">
      <aside class="panel">
        <div class="panel-head"><h2>Check in an item</h2></div>
        <div class="panel-body">
          <form id="ticketForm">
            <label>Owner name<input id="customer" name="customer" required placeholder="e.g. Jordan Lee" /></label>
            <label>Item to repair<input id="title" name="title" required placeholder="e.g. 2012 desk lamp" /></label>
            <label>Urgency<select id="priority" name="priority"><option value="high">Deadline soon</option><option value="medium" selected>Normal</option><option value="low">Flexible</option></select></label>
            <label>Repair type<select id="channel" name="channel"><option>Electronics</option><option>Clothing</option><option>Furniture</option><option>Small appliance</option></select></label>
            <label>What is broken?<textarea id="description" name="description" placeholder="Describe the problem and any useful clues..."></textarea></label>
            <div class="button-row"><button class="primary" type="submit">Check in item</button><button class="secondary" type="reset">Clear</button></div>
          </form>
        </div>
      </aside>

      <section class="panel">
        <div class="panel-head">
          <h2>Repair queue</h2>
          <div class="queue-toolbar"><input id="search" placeholder="Search repairs..." aria-label="Search repairs" /><select id="filter" aria-label="Filter tickets"><option value="all">All urgency levels</option><option value="high">Deadline soon</option><option value="medium">Normal</option><option value="low">Flexible</option></select></div>
        </div>
        <div id="queueList" class="queue-list"></div>
        <div class="queue-footer"><small id="footerMessage">First checked in, first repaired</small><button id="processBtn" class="process" type="button">Start next repair</button></div>
      </section>
    </section>
  </main>
  <div id="toast" class="toast" role="status"></div>

  <script>
    // Queue application: repair jobs are handled strictly in FIFO order.
    const queue = [
      { id: 1, customer: 'Maya Chen', title: 'Vintage desk lamp', priority: 'high', channel: 'Electronics', description: 'Family heirloom; needs to work before Saturday dinner.', createdAt: Date.now() - 18 * 60000 },
      { id: 2, customer: 'Andre Silva', title: 'Wool coat button repair', priority: 'medium', channel: 'Clothing', description: 'One button is missing from an otherwise great coat.', createdAt: Date.now() - 11 * 60000 },
      { id: 3, customer: 'Priya Shah', title: 'Loose cabinet hinge', priority: 'low', channel: 'Furniture', description: 'The door still works, but the hinge needs tightening.', createdAt: Date.now() - 5 * 60000 }
    ];
    let resolved = 0;
    let nextId = 4;

    const form = document.querySelector('#ticketForm');
    const queueList = document.querySelector('#queueList');
    const search = document.querySelector('#search');
    const filter = document.querySelector('#filter');
    const processBtn = document.querySelector('#processBtn');
    const toast = document.querySelector('#toast');

    function escapeHTML(value) {
      return String(value).replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[char]));
    }

    function formatWait(createdAt) {
      const minutes = Math.max(0, Math.floor((Date.now() - createdAt) / 60000));
      return minutes === 0 ? 'just now' : `${minutes}m waiting`;
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => toast.classList.remove('show'), 2600);
    }

    function render() {
      const query = search.value.trim().toLowerCase();
      const selectedPriority = filter.value;
      const visible = queue.filter(ticket => {
        const matchesSearch = `${ticket.customer} ${ticket.title} ${ticket.channel}`.toLowerCase().includes(query);
        return matchesSearch && (selectedPriority === 'all' || ticket.priority === selectedPriority);
      });

      queueList.innerHTML = visible.length ? visible.map((ticket) => `
        <article class="ticket">
          <div class="position">${queue.indexOf(ticket) + 1}</div>
          <div>
            <div class="ticket-title">${escapeHTML(ticket.title)}</div>
            <div class="ticket-meta"><span>${escapeHTML(ticket.customer)}</span><span>·</span><span>${escapeHTML(ticket.channel)}</span><span>·</span><span class="pill ${ticket.priority}">${ticket.priority}</span><span>·</span><span>${formatWait(ticket.createdAt)}</span></div>
            ${ticket.description ? `<div class="ticket-description">${escapeHTML(ticket.description)}</div>` : ''}
          </div>
          <div class="ticket-actions"><button class="icon-btn" title="Remove ticket" data-remove="${ticket.id}">Remove</button></div>
        </article>
      `).join('') : `<div class="empty"><strong>${queue.length ? 'No matching tickets' : 'The queue is empty'}</strong>${queue.length ? 'Try another search or filter.' : 'Add a ticket to get started.'}</div>`;

      document.querySelector('#waitingCount').textContent = queue.length;
      document.querySelector('#highCount').textContent = queue.filter(t => t.priority === 'high').length;
      const avg = queue.length ? Math.round(queue.reduce((sum, t) => sum + (Date.now() - t.createdAt) / 60000, 0) / queue.length) : 0;
      document.querySelector('#avgWait').textContent = `${avg}m`;
      document.querySelector('#resolvedCount').textContent = resolved;
      processBtn.disabled = queue.length === 0;
      document.querySelector('#footerMessage').textContent = queue.length ? `Next up: ${queue[0].customer}` : 'First in, first out';
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      const data = new FormData(form);
      queue.push({ id: nextId++, customer: data.get('customer'), title: data.get('title'), priority: data.get('priority'), channel: data.get('channel'), description: data.get('description'), createdAt: Date.now() });
      form.reset();
      render();
      showToast('Ticket added to the end of the queue');
    });

    processBtn.addEventListener('click', () => {
      if (!queue.length) return;
      const ticket = queue.shift();
      resolved++;
      render();
      showToast(`Resolved: ${ticket.title}`);
    });

    queueList.addEventListener('click', event => {
      const button = event.target.closest('[data-remove]');
      if (!button) return;
      const index = queue.findIndex(ticket => ticket.id === Number(button.dataset.remove));
      if (index !== -1) {
        const [removed] = queue.splice(index, 1);
        render();
        showToast(`Removed: ${removed.title}`);
      }
    });

    search.addEventListener('input', render);
    filter.addEventListener('change', render);
    setInterval(render, 60000);
    render();
  </script>
</body>
</html>
